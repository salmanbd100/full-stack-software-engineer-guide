name: lint:docs

# The Book Chapter Standard, enforced. Improvement #6.
#
# The gate is `.lint-baseline.json`, not zero. Most of this manuscript predates the
# standard, so a hard zero would leave this workflow red until improvement #19 and
# train everyone to ignore it. A count that goes up fails the build; a count that goes
# down is committed as the new baseline. Each rule becomes a hard gate on its own the
# moment its baseline reaches 0.

# Automatic runs were off between 2026-08-29 and 2026-09-23, while the manuscript was
# being restructured and a red build would have mailed on every push. Restored at
# improvement #88: the restructure finished four phases ago, every check below is green,
# and non-negotiable #10 says code samples are enforced in CI rather than remembered.
# `workflow_dispatch` stays, because running it by hand before a push is still useful.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Book Chapter Standard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔴 No `version:` here. pnpm/action-setup refuses to run when the version is
      # declared twice — once in this file and once as `packageManager` in package.json —
      # and package.json is the one that also pins the version used locally. This was the
      # first thing #88 found when it turned automatic runs back on: the workflow had been
      # failing at setup since `packageManager` was added, and nobody saw it because the
      # only runs were manual ones nobody watched.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint documentation
        run: pnpm lint:docs

      - name: Check reading-order numbers are current
        # Fails if a chapter has been added or moved without renumbering its part —
        # the build would otherwise put it somewhere alphabetical. Improvement #70.
        run: pnpm number:chapters --check

      - name: Check the interview-question index is current
        # The index is generated from every chapter's Interview Questions block, so a
        # chapter edit silently invalidates it. Improvement #73.
        run: pnpm index:check

      - name: Type-check every code sample
        # Syntax is a hard gate at zero; the type diagnostics ratchet against
        # .code-samples-baseline.json the way lint:docs does. Improvement #75.
        run: pnpm check:code-samples

      - name: Generate the companion site's pages
        # Cheap, and it is the only thing that catches a sample chapter renamed out from
        # under SAMPLE_CHAPTERS in build-site.ts. Improvement #78.
        run: pnpm site:pages

      - name: Check the plan's counters agree
        run: pnpm plan:check

      - name: Run the script test suite
        # scripts/lib/book.ts is imported by the build, the lint, the numberer, the
        # index, the page measurer and the site generator, so a wrong answer there is a
        # wrong book everywhere at once. Improvement #94.
        run: pnpm test

      - name: Assemble the manuscript
        # Catches an ordering or front-matter change that breaks collection, without
        # paying for a full LaTeX toolchain on every push. The PDF build is #77.
        run: pnpm book:collect
