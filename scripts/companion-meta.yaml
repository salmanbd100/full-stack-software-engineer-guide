# Companion-volume metadata for the pandoc build (improvement #86).
#
# The DSA appendix ships as its own volume — BOOK-SPEC.md § 5 and decision #6 — so it
# needs its own metadata rather than the handbook's. Everything a shop reads is different:
# a different title, a different description, and a different identifier, because to a
# retailer this is a second product and not a second printing of the first.
#
# What is deliberately identical: the author, the edition line, the language and the
# rights. It is the same book's companion, not a separate publication.
